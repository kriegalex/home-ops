---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  template: .taskfiles/template

tasks:

  default: task --list

  reconcile:
    desc: Force ArgoCD to sync all applications from your Git repository
    cmd: argocd app sync cluster-apps --grpc-web
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which argocd

  argocd:login:
    desc: Login to ArgoCD (requires port-forward to be running)
    cmd: argocd login localhost:8080 --grpc-web --insecure
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which argocd

  argocd:dashboard:
    desc: Open ArgoCD dashboard (starts port-forward)
    cmd: kubectl port-forward svc/argocd-server -n argocd 8080:443
    preconditions:
      - test -f {{.KUBECONFIG}}

  argocd:password:
    desc: Get initial ArgoCD admin password
    cmd: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo
    preconditions:
      - test -f {{.KUBECONFIG}}
